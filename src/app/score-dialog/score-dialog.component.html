<div class="modal-content">
  <div class="modal-header">
    <h5 class="modal-title">Enter Gymnastics Scores - {{ playerName }}</h5>
    <button type="button" class="close" data-dismiss="modal" aria-label="Close" (click)="onNoClick()">
      <span aria-hidden="true">×</span>
    </button>
  </div>
  <div class="modal-body">
    <div class="score-form-two-cols">
      
      <!-- Left Column -->
      <div class="score-column">
        <!-- Main Scoring Section -->
        <div class="score-section">
          <h6>Main Scoring</h6>
          
          <div class="form-group">
            <label for="difficultyScore">Difficulty Score (0-10):</label>
            <input type="number" 
                   class="form-control" 
                   id="difficultyScore" 
                   [formControl]="difficultyScoreControl"
                   step="0.1"
                   min="0"
                   max="10">
            <small class="form-text text-muted">Technical difficulty</small>
          </div>
          
          <div class="form-group">
            <label for="executionScore">Execution Score (0-10):</label>
            <input type="number" 
                   class="form-control" 
                   id="executionScore" 
                   [formControl]="executionScoreControl"
                   step="0.1"
                   min="0"
                   max="10">
            <small class="form-text text-muted">Quality of execution</small>
          </div>

          <div class="form-group">
            <label for="deductions">Deductions (0-10):</label>
            <input type="number" 
                   class="form-control" 
                   id="deductions" 
                   [formControl]="deductionsControl"
                   step="0.1"
                   min="0"
                   max="10">
            <small class="form-text text-muted">Penalties</small>
          </div>
          
          <div class="form-group">
            <label for="totalScore">Total Score (Auto):</label>
            <input type="number" 
                   class="form-control total-score-display" 
                   id="totalScore" 
                   [formControl]="totalScoreControl"
                   readonly>
            <small class="form-text text-muted">D + E - Deductions</small>
          </div>
        </div>
      </div>

      <!-- Right Column -->
      <div class="score-column">
        <!-- Additional Scoring Section -->
        <div class="score-section">
          <h6>Additional Scoring</h6>
          
          <div class="form-group">
            <label for="fallCount">Fall Count:</label>
            <input type="number" 
                   class="form-control" 
                   id="fallCount" 
                   [formControl]="fallCountControl"
                   min="0">
            <small class="form-text text-muted">Number of falls</small>
          </div>
          
          <div class="form-group">
            <label for="landingQuality">Landing Quality (0-3):</label>
            <select class="form-control" id="landingQuality" [formControl]="landingQualityControl">
              <option value="0">Poor (0)</option>
              <option value="1">Fair (1)</option>
              <option value="2">Good (2)</option>
              <option value="3">Excellent (3)</option>
            </select>
            <small class="form-text text-muted">Landing assessment</small>
          </div>

          <div class="form-group">
            <label for="artisticScore">Artistic Score (0-10):</label>
            <input type="number" 
                   class="form-control" 
                   id="artisticScore" 
                   [formControl]="artisticScoreControl"
                   step="0.1"
                   min="0"
                   max="10">
            <small class="form-text text-muted">Presentation</small>
          </div>
          
          <div class="form-group">
            <label for="technicalScore">Technical Score (0-10):</label>
            <input type="number" 
                   class="form-control" 
                   id="technicalScore" 
                   [formControl]="technicalScoreControl"
                   step="0.1"
                   min="0"
                   max="10">
            <small class="form-text text-muted">Technical precision</small>
          </div>
        </div>
      </div>

    </div>

    <!-- Current Apparatus Display -->
    <div class="apparatus-info">
      <div class="alert alert-info">
        <strong>Current Apparatus:</strong> {{ data.currentApparatus || 'Unknown' }}
      </div>
    </div>

  </div>
  <div class="modal-footer">
    <button type="button" class="btn btn-secondary" (click)="onNoClick()">Cancel</button>
    <button type="button" class="btn btn-warning" (click)="onResetClick()">Reset</button>
    <button type="button" class="btn btn-primary" (click)="onSaveClick()" [disabled]="form.invalid">Save Scores</button>
  </div>
</div>
